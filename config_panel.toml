version = "1.0"

[main]
    name.en = "Catalogue"

    [main.catalogue]
        [main.catalogue.relays]
        ask.en = "Nostr relays"
        help.en = "Comma-separated relay URLs, for example wss://relay.example"
        type = "string"
        default = "wss://relay.damus.io,wss://nos.lol"
        bind = "null"

        [main.catalogue.trusted_publishers]
        ask.en = "Trusted publisher keys"
        help.en = "One npub or hex public key per line; remove a line to stop trusting that publisher"
        type = "text"
        bind = "null"

    [main.curation]
        name.en = "Curation"

        [main.curation.trusted_curators]
        ask.en = "Trusted curator keys"
        help.en = "One npub or hex public key per line; leave empty to disable curation"
        type = "text"
        bind = "null"

        [main.curation.minimum_endorsements]
        ask.en = "Minimum endorsements"
        help.en = "Required trusted endorsements for canonical app selection"
        type = "number"
        default = 1
        bind = "null"

    [main.trust]
        name.en = "Attestation trust policy"

        [main.trust.attestation_policy]
        ask.en = "Attestation policy"
        help.en = "off: CI attestations are informational only. prefer: keep every app installable, but mark attested ones verified. require: exclude an app from this catalogue until it has enough acceptable CI attestations for its exact commit."
        type = "select"
        choices = ["off", "prefer", "require"]
        default = "off"
        bind = "null"

        [main.trust.minimum_attestations]
        ask.en = "Minimum attestations"
        help.en = "Only affects prefer/require above, not off. Independent verifiers that must each attest a passing (or required-checks-satisfying) result before a revision counts as verified."
        type = "number"
        default = 1
        bind = "null"

        [main.trust.required_checks]
        ask.en = "Required checks"
        help.en = "Only affects prefer/require above, not off. One check name per line (e.g. package_check). When set, an attestation is acceptable only if every named check individually passed - its overall result is ignored, so an unrelated advisory check (e.g. vulnerability_scan) may still fail. Leave empty to judge only the overall result."
        type = "text"
        bind = "null"

        [main.trust.trusted_verifiers]
        ask.en = "Trusted verifiers"
        help.en = "Only affects prefer/require above, not off. One npub or hex public key per line; only attestations signed by one of these count toward verification. Leave empty to trust any verifier."
        type = "text"
        bind = "null"

    [main.discovery]
        name.en = "Discovery"

        [main.discovery.refresh]
        ask.en = "Refresh catalogue now"
        help.en = "Restart the catalogue service to perform a fresh relay fetch"
        type = "button"
        style = "success"
        icon = "refresh-cw"
        bind = "null"

[publisher]
    name.en = "Publisher"

    [publisher.identity]
        name.en = "Publisher identity"

        [publisher.identity.publisher_npub]
        ask.en = "Publisher identity"
        help.en = "Add this npub to trusted publishers on other catalogue servers"
        type = "string"
        bind = "null"
        readonly = true

    [publisher.publish]
        name.en = "Publish an application"

        [publisher.publish.repository_url]
        ask.en = "YunoHost app repository URL"
        help.en = "HTTPS URL of a repository containing manifest.toml"
        type = "url"
        bind = "null"

        [publisher.publish.ref]
        ask.en = "Git ref"
        help.en = "Branch, tag, or commit to publish"
        type = "string"
        default = "main"
        bind = "null"

        [publisher.publish.publish]
        ask.en = "Publish signed declaration"
        help.en = "Verify the repository, sign its current declaration, and publish it to the configured relays"
        type = "button"
        style = "success"
        icon = "upload"
        enabled = "repository_url"
