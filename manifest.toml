packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh24"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# This app has no installation questions: it is a loopback-only daemon whose
# settings are exposed through config_panel.toml.
[install]

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.11/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "fe337db4b863b3d57317d62161972bcdb662328810ac28ffd71336f7a5a525b4"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.11/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "7972d12bd17da479da4539f8752e0ac52259f48a0a1dc0c7fc437f07c7d55960"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.11/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "618c04492b00439e631431e22c8df6fbc632654bb79f7b491d4d2cb13677aab6"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"
