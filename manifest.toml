packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh17"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# This app has no installation questions: it is a loopback-only daemon whose
# settings are exposed through config_panel.toml.
[install]

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.7/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "41994f09ff2348771c3d9927f3eaca3fafe2f82f4ef6f2efa4a2cc40b53dbd09"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.7/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "0e587caf1c7b67e11d08d529e60fae59581b028d275d7cf59f5744c68938df49"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.7/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "a3ccf3290a934737b2835a04c1c4fd76810db55f22d0edb9b25a73e3f3ef6158"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"
