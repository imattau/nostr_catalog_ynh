packaging_format = 2

id = "nostr_catalog"
name = "Nostr Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh39"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/imattau/nostr-yunohost"
code = "https://github.com/imattau/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# The catalogue daemon itself remains loopback-only (settings exposed through
# config_panel.toml as before); the domain/port below are only for the
# admins-only attestation page (see resources.permissions.main).
[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.22/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "9034e44a989c5470ae5a6679aa8cf35ad933f4b206f119c1a9bb57615a9ae248"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.22/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "d8ca6afff025a4b067ea80749361905a8b7869f374891d648205cb95b2c0d894"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.22/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "cef0cc59a412826b256c1bb369b170616c27dd90ff6bc86b7238d8c97740f9cf"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"

    [resources.permissions.main]
        # This app has no public part at all: the daemon's own /v3/apps.json
        # and /v3/logos/ stay loopback-only (consumed locally by YunoHost's
        # catalogue registration, never proxied), so there is no visitor
        # permission to carve an admin exception out of - one single,
        # admins-only permission and tile is the whole surface.
        url = "/"
        allowed = "admins"
        show_tile = true
        protected = true
        label = "Nostr Catalogue Attestations"

    [resources.ports.main]
        default = 8095
