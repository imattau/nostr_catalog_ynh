packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh13"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.4/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "712ef33034bfcc32094e2d540d2cad64e5a024ce465370100dd6cd31af60b564"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.4/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "018a2180c5d4b901147d1bb28cc880150c16985747ddf88de2300b27ce58a131"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.4/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "619063e4c36cc2882003652163b6e3933fab905d032af5b7f041ac3376e019b5"

    [resources.system_user]
