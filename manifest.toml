packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh10"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.1/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "ed561d03ce6a7ddcef3f9b9fe1029dcf83921befaec46af1102276b0224382f2"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.1/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "760cd97cbda229f6cacf20c599208dbb1cedea8f379eefa726369077e96f481e"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.1/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "e488b06c2e52f2bb348abfef78355fdd58c7088213d3998768f15e6d07af94e4"

    [resources.system_user]
