packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh26"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# This app has no installation questions: it is a loopback-only daemon whose
# settings are exposed through config_panel.toml.
[install]

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.13/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "ccff449c7ef6c2e9acc900f43840fe2debb11ed1265a51c2b0289a9849559af1"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.13/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "f66d47e208700211bfe013325ddbdd073589bbf1eedff4f531c9cddc848cabee"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.13/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "520eb3329072d83ad0862424d4de44a0a8b3b40d7c239b6290ea537ac9b99407"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"
