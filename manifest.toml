packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh31"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# The catalogue daemon itself remains loopback-only (settings exposed through
# config_panel.toml as before); the domain/port below are only for the
# admins-only attestation page (see resources.permissions.main).
[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.18/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "09bed25d70a45e1e8e63b3e109ca8fd2d8f80ac70f4541ad63afbefd2e621051"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.18/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "e5a44294cdd568cba2db52eaa87101d04b3538cb94b16659072b873395fcfc16"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.18/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "9dfcdc4543f4ed060e85a75d2346ccbbd47b77322044cdbd8024d34e893f26dc"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"

    [resources.permissions.main]
        # This app has no public part at all: the daemon's own /v3/apps.json
        # and /v3/logos/ stay loopback-only (consumed locally by YunoHost's
        # catalogue registration, never proxied), so there is no visitor
        # permission to carve an admin exception out of - one single,
        # admins-only permission and tile is the whole surface.
        url = "/"
        allowed = "admins"
        show_tile = true
        protected = true
        label = "Nostr Catalogue Attestations"

    [resources.ports.main]
        default = 8095
