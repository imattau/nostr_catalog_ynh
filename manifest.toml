packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh30"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# This app has no installation questions: it is a loopback-only daemon whose
# settings are exposed through config_panel.toml.
[install]

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.17/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "2ed31746135b56ab4678aa2ae2a4994057ece8ab70ff9c9eedd5f40ed13cc9b3"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.17/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "b50996426597d6d186318a95e39b515bdcf7547528c9d9843aa29a417b99bb67"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.17/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "1a1388590ec761bd8194b0b307746e4fe0345fd1d5427571628ff2d85354c7d7"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"
