packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh32"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# The catalogue daemon itself remains loopback-only (settings exposed through
# config_panel.toml as before); the domain/port below are only for the
# admins-only attestation page (see resources.permissions.main).
[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.19/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "216dbebe71368e2d1559f1462e120688a023453a1dd89c2bcd1eb7d54c8c2e33"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.19/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "8468e7fca7ef053ca3aae207631957e484f9ccc65a0d57810279288b5ba25312"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.19/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "6d742379bfaec308dcb4c8c91b4095175e464f09563596f3134a3ed115dc1573"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"

    [resources.permissions.main]
        # This app has no public part at all: the daemon's own /v3/apps.json
        # and /v3/logos/ stay loopback-only (consumed locally by YunoHost's
        # catalogue registration, never proxied), so there is no visitor
        # permission to carve an admin exception out of - one single,
        # admins-only permission and tile is the whole surface.
        url = "/"
        allowed = "admins"
        show_tile = true
        protected = true
        label = "Nostr Catalogue Attestations"

    [resources.ports.main]
        default = 8095
