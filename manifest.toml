packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh12"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.3/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "70fca2eb79c79e4040a5a25db72fa010377f18dcb7c62817daac374b30929624"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.3/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "b8ab49e523a4a9a600872097ebe24579662bf24cf9df9017b0509eb01ec98644"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.3/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "d4f2a4fa891aa72318d39d8a59884ac350efbd8cffc8dc55e5a50845535ec8b1"

    [resources.system_user]
