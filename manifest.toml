packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh11"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.2/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "1f5721ebafb2635ee419106410a10b1b95843044cfe797f435a83ae80889ad30"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.2/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "441df5e417e55855d8b1e2f5b6159bb3070c79ea723d0cdaf4c2b1eba5a1afa4"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.2/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "9a7adc5baed69fb8ee7bb8ceef51ebbe87b7fa89b2437126b2e49fde3328aeac"

    [resources.system_user]
