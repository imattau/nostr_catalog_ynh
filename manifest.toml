packaging_format = 2

id = "nostr_catalog"
name = "Nostr YunoHost Catalogue"
description.en = "Decentralised YunoHost application catalogue using Nostr"
version = "0.1~ynh20"
maintainers = ["Nostr YunoHost contributors"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://github.com/nostr-yunohost/nostr-yunohost"
code = "https://github.com/nostr-yunohost/nostr-yunohost"

[integration]
yunohost = ">= 12.0"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

# This app has no installation questions: it is a loopback-only daemon whose
# settings are exposed through config_panel.toml.
[install]

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.10/nostr-yunohost-linux-amd64.tar.gz"
        sha256 = "1f7979dccdc382f46ee6fba3ae2fd2203a69c3d6dd4c1bd832b9082b64117bd1"
        format = "tar.gz"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "nostr-yunohost-linux-amd64.tar.gz"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.10/nostr-yunohost-linux-arm64.tar.gz"
        sha256 = "abe1357f1f4b563b3447238da10a066bbb4e17517c06532518c46301aa89ac58"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/nostr-yunohost/releases/download/v0.1.10/nostr-yunohost-linux-armv7.tar.gz"
        sha256 = "c1e07aa1874b55cf75776a80b3db80aad636e57219d2bf5dfaf45b15612ad004"

    [resources.system_user]

    [resources.install_dir]
        dir = "/var/lib/nostr-catalogd"

    [resources.apt]
        packages = "git, jq"
