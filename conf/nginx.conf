location / {

  proxy_pass      http://127.0.0.1:__PORT__/;
  # This location is the admins-only attestation page (see
  # resources.permissions.main in manifest.toml) - unlike nostr_auth_ynh's
  # unauthenticated /nostr-login, this one requires an existing SSOwat
  # session. The actual login gate comes from the permission's own
  # allowed/protected settings, not from this include; "with_auth" (as
  # opposed to "no_auth") just means the Ynh-User/-Email/-Fullname headers
  # get forwarded to the app rather than blanked, which is fine for an
  # admin-only page. Confirmed against YunoHost core
  # (conf/nginx/proxy_params_with_auth vs proxy_params_no_auth) - there is
  # no plain "proxy_params" file.
  include         proxy_params_with_auth;
  proxy_redirect  off;

  client_max_body_size 1M;
}
