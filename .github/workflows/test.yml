name: Validate YunoHost wrapper

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate TOML
        run: |
          python3 - <<'PY'
          import tomllib
          for path in ("manifest.toml", "config_panel.toml"):
              with open(path, "rb") as handle:
                  tomllib.load(handle)
          print("TOML OK")

      - name: Validate manifest structure
        run: |
          python3 - <<'PY'
          import tomllib
          with open("manifest.toml", "rb") as handle:
              manifest = tomllib.load(handle)
          assert manifest["packaging_format"] == 2
          assert manifest["id"] == "nostr_catalog"
          assert manifest["resources"]["apt"]["packages"] == "git, jq"
          assert manifest["resources"]["install_dir"]["dir"] == "/var/lib/nostr-catalogd"
          assert "default" in tomllib.load(open("tests.toml", "rb"))
          print("Manifest structure OK")
          PY
          PY

      - name: Validate service template
        run: |
          sed 's#^ExecStart=.*#ExecStart=/bin/true#' conf/systemd.service > /tmp/nostr_catalog.service
          systemd-analyze verify /tmp/nostr_catalog.service

      - name: Validate shell scripts
        run: bash -n scripts/_common.sh scripts/config scripts/install scripts/remove scripts/upgrade scripts/backup scripts/restore
